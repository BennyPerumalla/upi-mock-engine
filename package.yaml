name:                upi-mock-engine
version:             0.1.0.0
synopsis:            Deterministic NPCI/UPI switch simulator and chaos-testing platform
description:         |
  UPI-MockEngine-Haskell is a locally deployable, event-sourced simulator of the
  NPCI/UPI switch. Phase 1 (v0.1) implements the synchronous transaction
  orchestration context: P2P Intent, P2P Collect and P2M QR flows over a
  compile-time-verified state machine, an append-only SQLite event log, an STM
  CQRS read model, and an OpenAPI 3 contract derived from the Servant types.
  .
  See ARCHITECTURE.md for the module hierarchy and the Phase-2 seam map.
category:            Testing, Finance, Web
homepage:            https://github.com/upi-mockengine/upi-mock-engine#readme
bug-reports:         https://github.com/upi-mockengine/upi-mock-engine/issues
license:             BSD-3-Clause
license-file:        LICENSE
author:              UPI-MockEngine contributors
maintainer:          maintainers@upi-mockengine.dev
copyright:           (c) 2026 UPI-MockEngine contributors
github:              upi-mockengine/upi-mock-engine
tested-with:         GHC == 9.10.3

extra-source-files:
  - README.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - docs/adr/*.md

language: GHC2021

default-extensions:
  - DataKinds
  - DeriveAnyClass
  - DerivingStrategies
  - GADTs
  - LambdaCase
  - MultiWayIf
  - OverloadedStrings
  - RecordWildCards
  - StrictData
  - TypeFamilies

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -Wpartial-fields
  - -Wredundant-constraints

dependencies:
  - base                 >= 4.20   && < 4.22
  - aeson                >= 2.2    && < 2.3
  - bytestring           >= 0.11   && < 0.13
  - containers           >= 0.6    && < 0.8
  - text                 >= 2.0    && < 2.2
  - time                 >= 1.12   && < 1.15

library:
  source-dirs: src
  dependencies:
    - http-types           >= 0.12   && < 0.13
    - mtl                  >= 2.3    && < 2.4
    - openapi3             >= 3.2    && < 3.3
    - optparse-applicative >= 0.18   && < 0.20
    - resource-pool        >= 0.4    && < 0.5
    - servant              >= 0.20   && < 0.21
    - servant-openapi3     >= 2.0    && < 2.1
    - servant-server       >= 0.20   && < 0.21
    - sqlite-simple        >= 0.4.19 && < 0.5
    - stm                  >= 2.5    && < 2.6
    - transformers         >= 0.6    && < 0.7
    - uuid                 >= 1.3    && < 1.4
    - wai                  >= 3.2    && < 3.3

executables:
  upi-mock-engine:
    main: Main.hs
    source-dirs: app
    dependencies:
      - upi-mock-engine
      - optparse-applicative >= 0.18 && < 0.20
      - wai                  >= 3.2  && < 3.3
      - wai-extra            >= 3.1  && < 3.2
      - warp                 >= 3.3  && < 3.5
    # Section 9.2 of the design document. -feager-blackholing is a compile-time
    # flag; -N/-A64m/-n4m/-qg1 are RTS defaults baked into the binary and remain
    # overridable at runtime because of -rtsopts.
    ghc-options:
      - -threaded
      - -rtsopts
      - -feager-blackholing
      - '"-with-rtsopts=-N -A64m -n4m -qg1"'

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    build-tools: hspec-discover:hspec-discover
    dependencies:
      - upi-mock-engine
      - hedgehog       >= 1.4  && < 1.6
      - hspec          >= 2.11 && < 2.12
      - hspec-hedgehog >= 0.1  && < 0.2
      - mtl            >= 2.3  && < 2.4
      # UPIMock.API.RoutesSpec asserts on the derived OpenAPI document. Depending
      # on openapi3 explicitly rather than leaning on the library's transitive
      # exposure: the document is a published contract, and the spec that pins it
      # should say so in the dependency list.
      - openapi3       >= 3.2  && < 3.3
      - uuid           >= 1.3  && < 1.4
    ghc-options:
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-N"'
      # hspec-discover generates `module Main where` with no export list. The
      # warning is about generated code, so it is switched off for this component
      # only rather than dropped from the project-wide set.
      - -Wno-missing-export-lists
